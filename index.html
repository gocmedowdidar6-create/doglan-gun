<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doglan günüň bilen ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #050008;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* Фоновое сияние */
body::before {
    content: "";
    position: fixed;
    width: 80vw;
    height: 80vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    background: radial-gradient(
        circle,
        rgba(255, 40, 110, 0.22),
        rgba(120, 0, 255, 0.08),
        transparent 70%
    );
    filter: blur(30px);
    animation: glow 5s ease-in-out infinite alternate;
}

@keyframes glow {
    from {
        transform: scale(0.8);
        opacity: .5;
    }
    to {
        transform: scale(1.2);
        opacity: 1;
    }
}

/* Главный экран */
.scene {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

/* Текст появляется слева направо */
.message {
    position: relative;
    z-index: 5;
    width: 90%;
    max-width: 1000px;
    text-align: center;

    font-size: clamp(24px, 5vw, 58px);
    line-height: 1.25;
    font-weight: 700;

    text-shadow:
        0 0 10px rgba(255, 80, 150, .8),
        0 0 30px rgba(255, 20, 100, .5),
        0 0 60px rgba(255, 0, 100, .3);

    animation: slideIn 2.8s cubic-bezier(.16,1,.3,1) forwards;
    transform: translateX(-120vw);
}

@keyframes slideIn {
    0% {
        transform: translateX(-120vw);
        opacity: 0;
    }

    60% {
        opacity: 1;
    }

    100% {
        transform: translateX(0);
        opacity: 1;
    }
}

.heart {
    display: inline-block;
    animation: heartbeat 1.4s ease-in-out infinite;
}

@keyframes heartbeat {
    0%, 100% {
        transform: scale(1);
    }
    50% {
        transform: scale(1.25);
    }
}

/* Летающие сердечки */
.floating-heart {
    position: absolute;
    bottom: -60px;
    font-size: 25px;
    opacity: 0;
    animation: floatUp linear infinite;
}

@keyframes floatUp {
    0% {
        transform: translateY(0) scale(.5) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: .8;
    }

    90% {
        opacity: .8;
    }

    100% {
        transform: translateY(-115vh) scale(1.4) rotate(360deg);
        opacity: 0;
    }
}

/* Маленькая подпись */
.signature {
    position: absolute;
    bottom: 7%;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 10;

    font-size: clamp(14px, 2vw, 20px);
    letter-spacing: 4px;
    opacity: 0;

    animation: appear 2s ease 3s forwards;
}

@keyframes appear {
    to {
        opacity: .7;
    }
}

/* Искры */
.spark {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: white;
    box-shadow: 0 0 12px white;
    animation: sparkle 2s ease-in-out infinite;
}

@keyframes sparkle {
    0%, 100% {
        opacity: 0;
        transform: scale(.3);
    }
    50% {
        opacity: 1;
        transform: scale(1);
    }
}

/* Для горизонтального телефона */
@media (orientation: landscape) and (max-height: 600px) {
    .message {
        max-width: 85%;
        font-size: clamp(22px, 6vh, 48px);
    }

    .signature {
        bottom: 5%;
    }
}
</style>
</head>

<body>

<div class="scene">

    <div class="message">
        DOGLAN GÜNIŇ BILEN TÜÝS ÝÜREGIMDEN
        GUTLAÝAN SÖÝGÜLIM,
        UZAK ÝAŞA, SÖÝÝÄN SENI
        <span class="heart">❤️‍🔥</span>
    </div>

    <div class="signature">
        TÜÝS ÝÜREGIMDEN ❤️
    </div>

</div>

<script>
/* Создаём летающие сердечки */
const hearts = ["❤️", "💗", "💕", "💖", "💘", "❤️‍🔥"];

for (let i = 0; i < 28; i++) {
    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];

    heart.style.left = Math.random() * 100 + "%";
    heart.style.animationDuration = (5 + Math.random() * 8) + "s";
    heart.style.animationDelay = (Math.random() * 8) + "s";
    heart.style.fontSize = (15 + Math.random() * 25) + "px";

    document.querySelector(".scene").appendChild(heart);
}

/* Создаём сияющие точки */
for (let i = 0; i < 35; i++) {
    const spark = document.createElement("div");

    spark.className = "spark";

    spark.style.left = Math.random() * 100 + "%";
    spark.style.top = Math.random() * 100 + "%";
    spark.style.animationDelay = Math.random() * 3 + "s";

    document.querySelector(".scene").appendChild(spark);
}
</script>

</body>
  </html>
